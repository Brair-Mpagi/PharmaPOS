[versions]
java                = "25"
springBoot          = "4.1.0"
springDependencyMgmt= "1.1.7"
springModulith      = "1.3.0"
flyway              = "10.22.0"
postgresql          = "42.7.4"
testcontainers      = "1.20.4"
junitJupiter        = "5.11.4"
archunit            = "1.3.0"
uuidCreator         = "6.0.0"
jacoco              = "0.8.12"
pit                 = "1.17.0"
pitJunit5           = "1.2.1"
mapstruct           = "1.6.3"
lombok              = "1.18.36"
opentelemetry       = "1.44.1"
springdocOpenapi    = "3.0.0"
mockito             = "5.14.2"
assertj             = "3.26.3"
awaitility          = "4.2.2"
jsonwebtoken        = "0.12.6"
bouncycastle        = "1.79"
micrometer          = "1.14.2"
slf4j               = "2.0.16"
logback             = "1.5.14"
jackson             = "2.18.2"

[libraries]
# Spring Boot
spring-boot-starter-web          = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa     = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security     = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation   = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator     = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test         = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-aop          = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-cache        = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

# Spring Modulith
spring-modulith-core             = { module = "org.springframework.modulith:spring-modulith-core", version.ref = "springModulith" }
spring-modulith-starter-jpa      = { module = "org.springframework.modulith:spring-modulith-starter-jpa", version.ref = "springModulith" }
spring-modulith-events-api       = { module = "org.springframework.modulith:spring-modulith-events-api", version.ref = "springModulith" }
spring-modulith-events-jpa       = { module = "org.springframework.modulith:spring-modulith-events-jpa", version.ref = "springModulith" }
spring-modulith-test             = { module = "org.springframework.modulith:spring-modulith-test", version.ref = "springModulith" }
spring-modulith-actuator         = { module = "org.springframework.modulith:spring-modulith-actuator", version.ref = "springModulith" }

# Database
postgresql-driver                = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core                      = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql                = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# UUID v7
uuid-creator                     = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

# Utilities
lombok                           = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct                        = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor              = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# Jackson
jackson-databind                 = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-module-parameter-names   = { module = "com.fasterxml.jackson.module:jackson-module-parameter-names", version.ref = "jackson" }

# Security / JWT
bouncycastle                     = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# Observability
opentelemetry-api                = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk                = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
micrometer-core                  = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-prometheus            = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# OpenAPI / Docs
springdoc-openapi-starter        = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }

# Testing
junit-jupiter                    = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-jupiter-api                = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-params             = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
archunit-junit5                  = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom               = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-core              = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit5            = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql        = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
mockito-core                     = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit5                   = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core                     = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility                       = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

[bundles]
spring-web                       = ["spring-boot-starter-web", "spring-boot-starter-validation", "spring-boot-starter-aop"]
spring-data                      = ["spring-boot-starter-data-jpa", "flyway-core", "flyway-postgresql", "postgresql-driver"]
spring-security                  = ["spring-boot-starter-security", "spring-boot-starter-oauth2-resource-server"]
spring-modulith                  = ["spring-modulith-core", "spring-modulith-starter-jpa", "spring-modulith-events-api", "spring-modulith-events-jpa"]
observability                    = ["spring-boot-starter-actuator", "opentelemetry-api", "micrometer-core", "micrometer-prometheus"]
testing                          = ["junit-jupiter", "junit-jupiter-params", "mockito-core", "mockito-junit5", "assertj-core", "awaitility"]
testing-integration              = ["testcontainers-core", "testcontainers-junit5", "testcontainers-postgresql"]

[plugins]
spring-boot                      = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management     = { id = "io.spring.dependency-management", version.ref = "springDependencyMgmt" }
pit-mutation                     = { id = "info.solidsoft.pitest", version.ref = "pit" }
