spring:
  application:
    name: pharmapos-cloud
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/pharmapos_pool}
    username: ${DATASOURCE_USERNAME:app_rw}
    password: ${DATASOURCE_PASSWORD:app_rw_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATASOURCE_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    user: ${FLYWAY_USER:migrator}
    password: ${FLYWAY_PASSWORD:migrator_secure_password}
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/tenant}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/tenant/protocol/openid-connect/certs}
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_pass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,application/javascript
  http2:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.pharmapos: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg - tenantId=%X{tenantId} userId=%X{userId} traceId=%X{traceId}%n'
  file:
    name: logs/pharmapos-cloud.log

pharmapos:
  tenant:
    default-currency: UGX
    lease-duration: PT24H
  security:
    rate-limit:
      enabled: true
      requests-per-minute: 60
    csp:
      enabled: true
      report-only: false
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: '*'
    allow-credentials: true
    max-age: 3600

---
# Local Development Profile
spring:
  config:
    activate:
      on-profile: local
  
  jpa:
    show-sql: true
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/tenant

logging:
  level:
    com.pharmapos: DEBUG
    org.springframework.security: DEBUG

pharmapos:
  security:
    csp:
      report-only: true

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production
  
  jpa:
    show-sql: false
  
  datasource:
    hikari:
      maximum-pool-size: 50

logging:
  level:
    root: WARN
    com.pharmapos: INFO
    org.springframework.security: INFO
  file:
    name: /var/log/pharmapos/cloud.log

pharmapos:
  security:
    csp:
      report-only: false
